<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Man vs Man</title>
    <style>
      :root {
        --fighter-size: 165px;
        --ink: #0d2c60;
        --red: #e03131;
        --blue: #2b6fe3;
        --panel: rgba(255, 255, 255, 0.9);
        --pixel: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='76' height='76'><g fill='%23ffffff' opacity='0.06'><rect x='0' y='0' width='38' height='38'/><rect x='38' y='38' width='38' height='38'/></g></svg>");
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #f4f9ff 0%, #dce9fb 45%, #c7daf6 100%);
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(2.2rem, 4.4vw, 3.4rem);
        color: var(--ink);
        letter-spacing: 1px;
        text-transform: uppercase;
        text-align: center;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.2rem, 2.4vw, 1.7rem);
        text-align: center;
      }

      /* ------------------------------ menu ------------------------------ */

      .menu-screen {
        width: min(96vw, 980px);
        max-height: 95vh;
        overflow-y: auto;
        background: var(--panel);
        border: 4px solid rgba(13, 44, 96, 0.18);
        border-radius: 28px;
        box-shadow: 0 16px 40px rgba(13, 44, 96, 0.14);
        padding: 30px 26px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .team-row,
      .character-grid,
      .mode-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 18px;
        width: 100%;
      }

      .selection-panel,
      .team-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 100%;
      }

      .panel-label {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(13, 44, 96, 0.72);
      }

      .panel-label.red-label { color: var(--red); }
      .panel-label.blue-label { color: var(--blue); }

      .team-btn,
      .character-card,
      .mode-btn,
      .start-btn,
      .ghost-btn {
        font: inherit;
        border: none;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }

      .team-btn:focus-visible,
      .character-card:focus-visible,
      .mode-btn:focus-visible,
      .start-btn:focus-visible,
      .ghost-btn:focus-visible {
        outline: 3px solid #0d2c60;
        outline-offset: 3px;
      }

      .mode-btn {
        flex: 1 1 190px;
        max-width: 280px;
        padding: 17px 22px;
        border-radius: 16px;
        font-size: 1.08rem;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: white;
        background: linear-gradient(180deg, #7fa5d6, #5c7fc2);
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.12);
      }

      .mode-btn.active {
        outline: 4px solid rgba(13, 44, 96, 0.35);
        background: linear-gradient(180deg, #3d7ae6, #234eb0);
      }

      .team-btn {
        flex: 1 1 220px;
        max-width: 300px;
        padding: 19px 24px;
        border-radius: 18px;
        font-size: 1.08rem;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: white;
        box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
      }

      .team-btn.red { background: linear-gradient(180deg, #ff5a5a, #d62828); }
      .team-btn.blue { background: linear-gradient(180deg, #4fa3ff, #1f5fd6); }

      .team-btn.active {
        outline: 4px solid rgba(13, 44, 96, 0.38);
        transform: translateY(-2px);
      }

      .character-card {
        position: relative;
        background: #f7faff;
        border: 4px solid rgba(13, 44, 96, 0.12);
        border-radius: 20px;
        padding: 16px 14px 13px;
        min-width: 168px;
        max-width: 224px;
        flex: 1 1 168px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: var(--ink);
      }

      .character-card img {
        width: 124px;
        height: 124px;
        object-fit: contain;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.18));
        pointer-events: none;
      }

      .character-card span {
        font-weight: 800;
        font-size: 1.08rem;
        text-align: center;
      }

      .character-card small {
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: rgba(13, 44, 96, 0.6);
        text-align: center;
      }

      .character-card.selected {
        border-color: var(--ink);
        background: linear-gradient(180deg, #edf5ff, #dfeeff);
        box-shadow: 0 10px 22px rgba(13, 44, 96, 0.12);
      }

      .character-card[data-player="red"].selected { border-color: var(--red); }
      .character-card[data-player="blue"].selected { border-color: var(--blue); }

      .start-btn {
        padding: 19px 38px;
        border-radius: 16px;
        font-size: 1.1rem;
        background: linear-gradient(180deg, #0d2c60, #1e4d94);
        color: white;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 10px 20px rgba(13, 44, 96, 0.25);
      }

      .ghost-btn {
        padding: 16px 28px;
        border-radius: 16px;
        font-size: 1.02rem;
        background: rgba(255, 255, 255, 0.16);
        border: 2px solid rgba(255, 255, 255, 0.75);
        color: white;
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .start-btn:hover,
      .team-btn:hover,
      .character-card:hover,
      .ghost-btn:hover {
        transform: translateY(-2px);
      }

      .hint {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 700;
        text-align: center;
        color: rgba(13, 44, 96, 0.7);
      }

      .hidden { display: none !important; }

      /* ----------------------------- battle ----------------------------- */

      .battle-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .hud {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 2vw, 20px);
        width: min(78vmin, 660px);
      }

      .hud-side {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
        min-width: 0;
      }

      .hud-side.blue-side { align-items: flex-end; }

      .hud-name {
        font-size: 0.95rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .hud-side.red-side .hud-name { color: var(--red); }
      .hud-side.blue-side .hud-name { color: var(--blue); }

      .health-bar {
        width: 100%;
        height: 18px;
        background: rgba(13, 44, 96, 0.16);
        border: 2px solid rgba(13, 44, 96, 0.35);
        border-radius: 999px;
        overflow: hidden;
      }

      .health-fill {
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #48d42d, #7df34d);
        transition: width 0.12s linear, background 0.2s linear;
      }

      .health-fill.hurt { animation: bar-flash 0.18s ease; }

      @keyframes bar-flash {
        0% { filter: brightness(2.2); }
        100% { filter: brightness(1); }
      }

      .hud-meta {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.03em;
        color: rgba(13, 44, 96, 0.75);
        width: 100%;
      }

      .hud-side.red-side .hud-meta { justify-content: flex-start; }
      .hud-side.blue-side .hud-meta { flex-direction: row-reverse; }

      .hud-badge {
        padding: 2px 9px;
        border-radius: 999px;
        background: rgba(13, 44, 96, 0.12);
        font-size: 0.74rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .hud-badge.badge-empty {
        background: #ef4444;
        color: #fff;
        animation: badge-pulse 1.1s ease-in-out infinite;
      }

      @keyframes badge-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      .timer {
        flex: 0 0 auto;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(13, 44, 96, 0.9);
        color: #eaf3ff;
        font-size: 0.95rem;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.06em;
      }

      .box {
        position: relative;
        width: min(78vmin, 660px);
        height: min(78vmin, 660px);
        background: var(--pixel), linear-gradient(180deg, #1d8dff, #0d5ec8);
        border: 7px solid rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        touch-action: manipulation;
      }

      .box.ko { animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

      @keyframes shake {
        10%, 90% { transform: translate3d(-3px, 1px, 0); }
        20%, 80% { transform: translate3d(5px, -2px, 0); }
        30%, 50%, 70% { transform: translate3d(-8px, 2px, 0); }
        40%, 60% { transform: translate3d(8px, -1px, 0); }
      }

      .fighter {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--fighter-size);
        height: var(--fighter-size);
        user-select: none;
        will-change: transform;
      }

      .fighter img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        pointer-events: none;
        filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.18));
        transition: filter 0.15s ease;
      }

      .fighter.red-team img {
        filter: sepia(0.35) saturate(1.7) hue-rotate(-20deg) drop-shadow(0 5px 10px rgba(0, 0, 0, 0.18));
      }

      .fighter.blue-team img {
        filter: sepia(0.35) saturate(1.7) hue-rotate(190deg) drop-shadow(0 5px 10px rgba(0, 0, 0, 0.18));
      }

      .fighter.hit img { filter: brightness(2.6) saturate(0.2); }

      .fighter.zapped img { animation: zapped 0.28s ease; }

      @keyframes zapped {
        0% { transform: translateX(-7px) rotate(-4deg); }
        50% { transform: translateX(7px) rotate(4deg); }
        100% { transform: none; }
      }

      .projectile {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        display: grid;
        place-items: center;
        user-select: none;
        pointer-events: none;
        will-change: transform;
        line-height: 1;
      }

      .projectile img {
        display: block;
        pointer-events: none;
        filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.32));
      }

      .projectile.middle-finger {
        font-size: 56px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .projectile.z-bullet {
        font-size: 36px;
        font-weight: 900;
        color: #eaffff;
        text-shadow: 0 0 10px rgba(120, 230, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 0.35);
      }

      /* A knife that hit a wall and is waiting to be collected. */
      .projectile.stuck img {
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45)) drop-shadow(0 0 6px rgba(255, 244, 160, 0.95));
      }

      .projectile.stuck::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 2px dashed rgba(255, 236, 120, 0.85);
        animation: stuck-pulse 1.2s ease-in-out infinite;
      }

      @keyframes stuck-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.92); }
        50% { opacity: 0.95; transform: scale(1.06); }
      }

      .projectile.collected {
        transition: transform 0.22s ease, opacity 0.22s ease;
        opacity: 0;
        transform: scale(0.4) !important;
      }

      /* A deflected projectile glows gold and comes back homing. */
      .projectile.parried img,
      .projectile.parried {
        filter: drop-shadow(0 0 8px rgba(255, 214, 102, 0.95));
      }

      .projectile.parried img { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35)) drop-shadow(0 0 7px rgba(255, 214, 102, 0.95)); }

      /* Knight's sword sweep. */
      .slash {
        position: absolute;
        z-index: 8;
        pointer-events: none;
        animation: slash-sweep 0.22s ease-out forwards;
      }

      .slash img {
        display: block;
        width: 92px;
        height: 25px;
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
      }

      @keyframes slash-sweep {
        0% { opacity: 0; transform-origin: 0% 50%; }
        20% { opacity: 1; }
        100% { opacity: 0; }
      }

      .damage-number.fade-out,
      .slash.fade-out {
        animation: fizzle 0.4s ease-out forwards;
      }

      .damage-number.variant-parry {
        font-size: 22px;
        color: #ffd666;
        text-shadow: 0 0 10px rgba(255, 200, 70, 0.8), 0 2px 6px rgba(0, 0, 0, 0.6);
      }

      .damage-number.variant-deflect {
        font-size: 19px;
        color: #ffb3b3;
      }

      .projectile.fizzle {
        animation: fizzle 0.4s ease-out forwards;
      }

      @keyframes fizzle {
        from { opacity: 1; }
        to { opacity: 0; filter: blur(3px); }
      }

      .damage-number {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 7;
        font-size: 24px;
        font-weight: 900;
        color: #fff8b0;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        white-space: nowrap;
        animation: float-up 0.68s ease-out forwards;
      }

      .damage-number.variant-pickup {
        font-size: 18px;
        color: #b6ffb0;
      }

      .damage-number.variant-paperwork {
        font-size: 20px;
        color: #ffe9a8;
      }

      @keyframes float-up {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        25% { opacity: 1; transform: translate(-50%, -80%) scale(1.12); }
        100% { opacity: 0; transform: translate(-50%, -190%) scale(0.95); }
      }

      .game-over {
        position: absolute;
        inset: 0;
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 20px;
        background: radial-gradient(70% 70% at 50% 45%, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.72));
        text-align: center;
        animation: fade-in 0.25s ease;
      }

      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

      .ko-title {
        font-size: clamp(2.6rem, 7vw, 4.4rem);
        font-weight: 900;
        color: white;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      }

      .ko-sub {
        margin: 0;
        font-size: clamp(1rem, 2.4vw, 1.28rem);
        font-weight: 800;
        color: #eaf3ff;
      }

      .ko-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 6px;
      }

      .battle-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .battle-actions .ghost-btn {
        background: rgba(13, 44, 96, 0.08);
        border-color: rgba(13, 44, 96, 0.35);
        color: var(--ink);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .box.ko,
        .fighter.zapped img,
        .health-fill.hurt,
        .projectile.stuck::after,
        .slash,
        .hud-badge.badge-empty { animation: none !important; }
      }

      /* Responsive fighter / arena scaling. game.js measures the real rendered
         size, so the simulation always matches what is on screen. */
      @media (max-width: 900px) {
        :root { --fighter-size: 132px; }
      }

      @media (max-width: 640px) {
        :root { --fighter-size: 104px; }
        .character-card { min-width: 142px; }
        .character-card img { width: 88px; height: 88px; }
        .hud-name { font-size: 0.8rem; }
        .hud-meta { font-size: 0.72rem; }
        .box, .hud { width: min(92vmin, 660px); }
      }

      @media (max-width: 420px) {
        :root { --fighter-size: 82px; }
      }
    </style>
  </head>
  <body>
    <!-- ============================== MENU ============================== -->
    <main class="menu-screen" id="menuScreen">
      <h1>Choose Your Game</h1>

      <div class="mode-row" role="group" aria-label="Game mode">
        <button class="mode-btn active" data-mode="one" type="button" aria-pressed="true">1 Player</button>
        <button class="mode-btn" data-mode="two" type="button" aria-pressed="false">2 Players</button>
      </div>

      <p class="hint" id="modeHint">You pick a team and a fighter — the game picks your rival.</p>

      <section class="team-section" id="teamSection" aria-labelledby="teamHeading">
        <h2 class="panel-label" id="teamHeading">Choose Your Team</h2>
        <div class="team-row" role="group" aria-label="Team">
          <button class="team-btn red active" data-team="red" type="button" aria-pressed="true">Red Team</button>
          <button class="team-btn blue" data-team="blue" type="button" aria-pressed="false">Blue Team</button>
        </div>
      </section>

      <section class="selection-panel" id="singlePlayerPanel" aria-labelledby="singleHeading">
        <h2 class="panel-label" id="singleHeading">Choose Your Character</h2>
        <div class="character-grid">
          <button class="character-card" data-character="angry" data-player="single" type="button" aria-pressed="false">
            <img src="assets/angryguy.png" alt="" />
            <span>Angry Guy</span>
            <small>Heavy hits</small>
          </button>
          <button class="character-card" data-character="sleepy" data-player="single" type="button" aria-pressed="false">
            <img src="assets/sleepyguy.png" alt="" />
            <span>Sleepy Guy</span>
            <small>Fast triple shots</small>
          </button>
          <button class="character-card" data-character="business" data-player="single" type="button" aria-pressed="false">
            <img src="assets/businessguy.png" alt="" />
            <span>Business Guy</span>
            <small>Briefcase burst</small>
          </button>
          <button class="character-card" data-character="chef" data-player="single" type="button" aria-pressed="false">
            <img src="assets/chefguy.png" alt="" />
            <span>Chef Guy</span>
            <small>2 knives, must retrieve</small>
          </button>
          <button class="character-card" data-character="knight" data-player="single" type="button" aria-pressed="false">
            <img src="assets/knightguy.png" alt="" />
            <span>Knight Guy</span>
            <small>Shield + sword</small>
          </button>
        </div>
      </section>

      <section class="selection-panel hidden" id="twoPlayerPanel" aria-labelledby="redHeading">
        <h2 class="panel-label red-label" id="redHeading">Red Team Character</h2>
        <div class="character-grid">
          <button class="character-card" data-character="angry" data-player="red" type="button" aria-pressed="false">
            <img src="assets/angryguy.png" alt="" />
            <span>Angry Guy</span>
            <small>Heavy hits</small>
          </button>
          <button class="character-card" data-character="sleepy" data-player="red" type="button" aria-pressed="false">
            <img src="assets/sleepyguy.png" alt="" />
            <span>Sleepy Guy</span>
            <small>Fast triple shots</small>
          </button>
          <button class="character-card" data-character="business" data-player="red" type="button" aria-pressed="false">
            <img src="assets/businessguy.png" alt="" />
            <span>Business Guy</span>
            <small>Briefcase burst</small>
          </button>
          <button class="character-card" data-character="chef" data-player="red" type="button" aria-pressed="false">
            <img src="assets/chefguy.png" alt="" />
            <span>Chef Guy</span>
            <small>2 knives, must retrieve</small>
          </button>
          <button class="character-card" data-character="knight" data-player="red" type="button" aria-pressed="false">
            <img src="assets/knightguy.png" alt="" />
            <span>Knight Guy</span>
            <small>Shield + sword</small>
          </button>
        </div>

        <h2 class="panel-label blue-label">Blue Team Character</h2>
        <div class="character-grid">
          <button class="character-card" data-character="angry" data-player="blue" type="button" aria-pressed="false">
            <img src="assets/angryguy.png" alt="" />
            <span>Angry Guy</span>
            <small>Heavy hits</small>
          </button>
          <button class="character-card" data-character="sleepy" data-player="blue" type="button" aria-pressed="false">
            <img src="assets/sleepyguy.png" alt="" />
            <span>Sleepy Guy</span>
            <small>Fast triple shots</small>
          </button>
          <button class="character-card" data-character="business" data-player="blue" type="button" aria-pressed="false">
            <img src="assets/businessguy.png" alt="" />
            <span>Business Guy</span>
            <small>Briefcase burst</small>
          </button>
          <button class="character-card" data-character="chef" data-player="blue" type="button" aria-pressed="false">
            <img src="assets/chefguy.png" alt="" />
            <span>Chef Guy</span>
            <small>2 knives, must retrieve</small>
          </button>
          <button class="character-card" data-character="knight" data-player="blue" type="button" aria-pressed="false">
            <img src="assets/knightguy.png" alt="" />
            <span>Knight Guy</span>
            <small>Shield + sword</small>
          </button>
        </div>
      </section>

      <button class="start-btn" id="startBattleBtn" type="button">Start Match</button>
    </main>

    <div class="battle-screen hidden" id="battleScreen">
      <div class="hud">
        <div class="hud-side red-side">
          <div class="hud-name" id="leftName">Red</div>
          <div class="health-bar" role="img" aria-label="Red team health">
            <div class="health-fill" id="leftHealthFill"></div>
          </div>
          <div class="hud-meta">
            <span id="leftHpText">100 HP</span>
            <span id="leftScore">Wins: 0</span>
            <span class="hud-badge hidden" id="leftBadge"></span>
          </div>
        </div>

        <div class="timer" id="roundTimer">0.0s</div>

        <div class="hud-side blue-side">
          <div class="hud-name" id="rightName">Blue</div>
          <div class="health-bar" role="img" aria-label="Blue team health">
            <div class="health-fill" id="rightHealthFill"></div>
          </div>
          <div class="hud-meta">
            <span id="rightHpText">100 HP</span>
            <span id="rightScore">Wins: 0</span>
            <span class="hud-badge hidden" id="rightBadge"></span>
          </div>
        </div>
      </div>

      <h1>Man vs Man</h1>

      <div class="box" id="playArea">
        <div class="fighter" id="fighterLeft">
          <img src="assets/angryguy.png" alt="" />
        </div>
        <div class="fighter" id="fighterRight">
          <img src="assets/sleepyguy.png" alt="" />
        </div>
      </div>

      <div class="battle-actions">
        <button class="start-btn" id="rematchBtn" type="button">Rematch</button>
        <button class="ghost-btn" id="menuBtn" type="button">Main Menu</button>
      </div>
    </div>

    <p class="sr-only" role="status" aria-live="polite" id="status"></p>
